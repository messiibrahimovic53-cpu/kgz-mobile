name: Build KGZ Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KGZMobileAndroidProject.zip'
      - '.github/workflows/main.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack Android project
        run: |
          unzip -o KGZMobileAndroidProject.zip -d project
          find project -maxdepth 3 -type f | head -100

      - name: Build APK
        run: |
          cd project
          find . -name gradlew -type f
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f app/gradlew ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found in ZIP"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KGZ-Mobile-debug-apk
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
